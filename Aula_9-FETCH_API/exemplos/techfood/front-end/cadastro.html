<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cadastre novos pratos no cardápio do TechFood." />
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/cadastro.css" />
    <title>TechFood - Cadastrar Prato</title>
  </head>
  <body>

    <!-- =====================================================
         HEADER — mesmo padrão das outras páginas (global.css)
         Link "Cadastrar Prato" recebe classe ativo via cadastro.js
    ===================================================== -->
    <header id="topo-loja">
      <h1 id="titulo-site">TechFood - Sabor &amp; Saber</h1>
      <p id="boas-vindas">Carregando...</p>

      <input type="checkbox" id="bt_menu" />
      <label for="bt_menu" id="label-menu" aria-label="Abrir menu">&#9776;</label>

      <nav id="menu">
        <ul>
          <li><a href="index.html">Cardápio</a></li>
          <li><a href="pedidos.html">Meus Pedidos</a></li>
          <li><a href="cadastro.html" class="menu-ativo">Cadastrar Prato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="secao-cadastro">
        <h2 class="titulo-secao">Cadastrar Novo Prato</h2>

        <!-- =====================================================
             CARD DO FORMULÁRIO
             Estratégia de imagem: FileReader (Base64)
             O usuário faz upload de um arquivo local,
             o JS converte para Base64 e mostra a preview.
             O Base64 é enviado no campo "imagem" para o POST /produtos.
        ===================================================== -->
        <div class="cadastro-card">

          <!-- Preview da imagem -->
          <div class="preview-box" id="preview-box">
            <span class="preview-placeholder" id="preview-placeholder">
              🍽️<br />Selecione uma imagem
            </span>
            <img id="preview-img" src="" alt="Preview do prato" style="display:none;" />
          </div>

          <form id="form-cadastro" novalidate>

            <!-- Campo: Imagem (estratégia FileReader / Base64) -->
            <div class="campo-grupo">
              <label for="input-imagem">Foto do Prato</label>
              <div class="upload-area" id="upload-area">
                <input
                  type="file"
                  id="input-imagem"
                  accept="image/*"
                  style="display:none;"
                />
                <button type="button" id="btn-escolher-imagem">
                  📁 Escolher imagem
                </button>
                <span id="nome-arquivo">Nenhum arquivo selecionado</span>
              </div>
            </div>

            <!-- Campo: Nome -->
            <div class="campo-grupo">
              <label for="input-nome">Nome do Prato <span class="obrigatorio">*</span></label>
              <input
                type="text"
                id="input-nome"
                placeholder="Ex: Lasanha à Bolonhesa"
                maxlength="80"
                required
              />
            </div>

            <!-- Campo: Descrição -->
            <div class="campo-grupo">
              <label for="input-descricao">Descrição <span class="obrigatorio">*</span></label>
              <textarea
                id="input-descricao"
                placeholder="Descreva os ingredientes e o preparo..."
                maxlength="300"
                rows="3"
                required
              ></textarea>
            </div>

            <!-- Linha: Preço + Categoria -->
            <div class="campo-linha">
              <div class="campo-grupo">
                <label for="input-preco">Preço (R$) <span class="obrigatorio">*</span></label>
                <input
                  type="number"
                  id="input-preco"
                  placeholder="0.00"
                  min="0"
                  step="0.01"
                  required
                />
              </div>

              <div class="campo-grupo">
                <label for="input-categoria">Categoria <span class="obrigatorio">*</span></label>
                <select id="input-categoria" required>
                  <option value="">-- Selecione --</option>
                  <option value="Massa">Massa</option>
                  <option value="Carne">Carne</option>
                  <option value="Frango">Frango</option>
                  <option value="Peixe">Peixe</option>
                  <option value="Salada">Salada</option>
                  <option value="Sobremesa">Sobremesa</option>
                  <option value="Bebida">Bebida</option>
                  <option value="Outro">Outro</option>
                </select>
              </div>
            </div>

            <!-- Campo: Disponível -->
            <div class="campo-grupo campo-toggle">
              <label>Disponível no cardápio?</label>
              <div class="toggle-box">
                <input type="checkbox" id="input-disponivel" checked />
                <label for="input-disponivel" class="toggle-label" aria-label="Disponível"></label>
                <span id="texto-disponivel">Sim</span>
              </div>
            </div>

            <!-- Feedback de erro / sucesso -->
            <div id="feedback-cadastro" style="display:none;"></div>

            <!-- Botões -->
            <div class="btn-grupo">
              <button type="button" id="btn-limpar-form" class="btn-secundario">
                Limpar
              </button>
              <button type="submit" id="btn-salvar" class="btn-primario">
                💾 Salvar Prato
              </button>
            </div>

          </form>
        </div>
      </section>
    </main>

    <footer id="rodape">
      <div class="info-footer">
        <p><strong>TechFood 2026</strong></p>
        <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
        <p>Av. das Nações, 1500</p>
      </div>
      <p id="data-hora-footer"></p>
    </footer>

    <!--
      Ordem dos scripts:
      1. global.js → saudação, footer, menu mobile
      2. api.js    → funções de fetch (cadastro.js depende delas)
      3. cadastro.js → lógica do formulário de cadastro
    -->
    <script src="src/scripts/global.js"></script>
    <script src="src/scripts/api.js"></script>
    <script src="src/scripts/cadastro.js"></script>
  </body>
</html>
